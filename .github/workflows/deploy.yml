name: Deploy frontend

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # public_html est aussi la racine d'autres domaines addon sur cet hebergement :
      # on ne synchronise/efface QUE le sous-dossier assets (propre a Olitech), jamais
      # la racine entiere, pour ne pas toucher aux fichiers des autres sites.
      - name: Deploy over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.SSH_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASSWORD" -e "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set ftp:ssl-allow true;
            set ftp:ssl-force true;
            mirror --reverse --delete --verbose dist/assets/ public_html/assets/;
            put -O public_html dist/index.html;
            put -O public_html dist/logo.png;
            put -O public_html dist/.htaccess;
            bye;
          " "$FTP_HOST"
